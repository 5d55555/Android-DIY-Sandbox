name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          android-licenses: true

      - name: Pub get
        run: flutter pub get

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons || true

      - name: Verify APK contents
        run: |
          APK=build/app/outputs/flutter-apk/app-normal-release.apk
          if [ ! -f "$APK" ]; then echo "APK missing: $APK"; exit 1; fi
          python3 - "$APK" <<'EOF'
          import sys, zipfile
          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          man = z.read('AndroidManifest.xml')
          # AXML string pool uses UTF-16
          ok_manifest = b'ShizukuProvider' in man or b'S\x00h\x00i\x00z\x00u\x00k\x00u\x00P\x00r\x00o\x00v\x00i\x00d\x00e\x00r\x00' in man
          found = False
          for n in z.namelist():
              if n.startswith('classes') and n.endswith('.dex'):
                  d = z.read(n)
                  if b'ShizukuProvider' in d or b'rikka/shizuku' in d:
                      found = True
                      break
          print('manifest ShizukuProvider:', ok_manifest)
          print('dex ShizukuProvider/rikka.shizuku classes:', found)
          if not (ok_manifest and found):
              sys.exit('VERIFY FAILED: ShizukuProvider missing from APK')
          print('VERIFY OK')
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/apk/*/release/*.apk
            android/app/outputs/apk/*/release/*.apk
          if-no-files-found: warn
